syntax = "proto3";

package peerdesk.proto;

enum AuthFailReason {
  AUTH_FAIL_UNSPECIFIED = 0;
  AUTH_FAIL_BAD_CREDENTIALS = 1;
  AUTH_FAIL_SESSION_BUSY = 2;
  AUTH_FAIL_PROTOCOL = 3;
}

enum MouseAction {
  MOUSE_UNSPECIFIED = 0;
  MOUSE_MOVE = 1;
  MOUSE_DOWN = 2;
  MOUSE_UP = 3;
  MOUSE_WHEEL = 4;
}

message Hello {
  uint32 version = 1;
  string username = 2;
}

message AuthChallenge {
  bytes salt = 1;
  bytes nonce = 2;
  uint32 t_cost = 3;
  uint32 m_cost = 4;
  uint32 parallelism = 5;
}

message AuthResponse {
  bytes hmac = 1;
}

message AuthOk {
  uint32 width = 1;
  uint32 height = 2;
}

message AuthFail {
  AuthFailReason reason = 1;
}

message VideoFrame {
  uint32 width = 1;
  uint32 height = 2;
  bytes h264 = 3;
}

message MouseEvent {
  MouseAction action = 1;
  uint32 button = 2;
  uint32 x = 3;
  uint32 y = 4;
  int32 wheel_delta = 5;
}

message KeyEvent {
  bool down = 1;
  uint32 keysym = 2;
}

message Ping {}
message Pong {}
message Disconnect {}

message Error {
  string message = 1;
}

message Envelope {
  oneof body {
    Hello hello = 1;
    AuthChallenge auth_challenge = 2;
    AuthResponse auth_response = 3;
    AuthOk auth_ok = 4;
    AuthFail auth_fail = 5;
    VideoFrame video = 6;
    MouseEvent mouse = 7;
    KeyEvent key = 8;
    Ping ping = 9;
    Pong pong = 10;
    Disconnect disconnect = 11;
    Error error = 12;
  }
}
